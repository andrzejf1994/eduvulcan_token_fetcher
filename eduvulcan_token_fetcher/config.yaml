# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: EduVulcan Token Fetcher
version: "0.4.8"
slug: eduvulcan_token_fetcher
description: >
  Automatycznie loguje się do eduVULCAN przez Playwright, pobiera JWT z /api/ap
  i zapisuje go w /config/eduvulcan_token.json. Monitoruje ważność tokena
  i odświeża go przed wygaśnięciem. Po 5 nieudanych próbach wysyła
  persistent notification w Home Assistant.
url: "https://developers.home-assistant.io/docs/add-ons"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
  - armhf
init: false
startup: services
homeassistant_api: true

map:
  - config:rw
  - data:rw

options:
  login: ""
  password: ""

schema:
  login: str
  password: password
